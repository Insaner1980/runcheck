name: Qodana Code Quality
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches: # Specify your branches here
      - main # The 'main' branch
      - 'releases/*' # The release branches

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0  # Qodana uses full history for branch analysis
          persist-credentials: false
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@b588768b6e7e6da579e518bc584f79de0d243692 # v2026.2.0
        with:
          pr-mode: false
          primary-cache-key: qodana-code-quality-2026.1-${{ github.ref }}-${{ github.sha }}
          additional-cache-key: qodana-code-quality-2026.1-${{ github.ref }}
