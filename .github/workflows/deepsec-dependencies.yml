name: DeepSec dependency checks
on:
  pull_request:
    branches: [main]
    paths:
      - '.deepsec/**'
      - '.github/workflows/deepsec-dependencies.yml'
  push:
    branches: [main]
    paths:
      - '.deepsec/**'
      - '.github/workflows/deepsec-dependencies.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Install pinned package manager
        run: npm install --global --no-audit --no-fund --ignore-scripts pnpm@11.25.0
      - name: Validate the frozen dependency graph
        working-directory: .deepsec
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec tsc --noEmit
          pnpm exec deepsec --help
          pnpm audit --audit-level moderate
          git diff --exit-code -- package.json pnpm-lock.yaml pnpm-workspace.yaml
